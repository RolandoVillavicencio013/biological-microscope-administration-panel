services:
  db:
    image: postgres:17
    container_name: biomicroscope_db_electron
    environment:
      POSTGRES_DB: biomicroscope_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - biomicroscope_pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  biomicroscope_pgdata:
